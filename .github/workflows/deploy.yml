name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

# 設定 GitHub Pages 權限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免多個部署並行衝突
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 # 移除強制依賴 lockfile 的快取設定，避免無 lockfile 時出錯
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies # 使用 --legacy-peer-deps 徹底避免套件版本衝突失敗
        run: npm install --legacy-peer-deps

      - name: Build with Vite
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
